<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="Explore the LivSafe interactive demo. All records and model outputs are simulated." />
    <title>LivSafe Demo | Interactive Prototype</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logos/livsafe-app-icon.svg" />
  </head>
  <body>
    <script type="text/javascript">
      (function () {
        var params = new URLSearchParams(window.location.search);
        var route = params.get("__gh_route");
        if (route) {
          var base = "%BASE_URL%".replace(/\/$/, "");
          window.history.replaceState(null, "", base + route);
        }
      })();
      (function (l) {
        if (l.search && l.search[1] === "/") {
          var decoded = l.search.slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
